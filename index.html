<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Gembound Kingdom</title>
<meta name="description" content="Gembound Kingdom — an original fantasy match-3 puzzle adventure. Free, no login, works offline.">
<meta name="theme-color" content="#2a1a5a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gembound">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sapphire:#14284D; --royal:#2859A8; --gold:#F4C75E; --white:#F8F7F1; --emerald:#39A879; --amethyst:#8866C8; --coral:#EF826F;
  --panel:linear-gradient(180deg,#5a3f9a,#3a2670); --panel2:linear-gradient(180deg,#fff8ea,#f3e3c8);
  --goldline:linear-gradient(180deg,#ffe9a8,#d9a13a 50%,#b8801f);
  --r:18px; --sh:0 6px 0 rgba(0,0,0,.18),0 10px 22px rgba(20,12,60,.35);
  --font:"Fredoka","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; --title:"Cinzel","Georgia",serif;
  --speed:1; --ts:44px; --tabh:84px; --fs:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1a1240;color:var(--white);font-family:var(--font);font-size:var(--fs);overscroll-behavior:none;}
body{overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:1rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{position:fixed;inset:0;display:flex;justify-content:center;background:radial-gradient(circle at 50% 30%,#3a2a7a,#140c34)}
#main{position:relative;width:100%;max-width:520px;height:100%;overflow:hidden;background:#2a1a5a}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex;animation:scrIn calc(.28s*var(--speed)) ease-out}
@keyframes scrIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#sidebar{display:none}

/* ---------- top status bar ---------- */
#topbar{position:absolute;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 8px 6px;pointer-events:none}
#topbar>*{pointer-events:auto}
#topbar.hide{display:none}
.me{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto}
.avatar{position:relative;width:52px;height:52px;border-radius:50%;padding:3px;background:var(--goldline);box-shadow:var(--sh);flex:0 0 auto}
.avatar .face{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle at 40% 30%,#8ac8ff,#2859A8)}
.avatar .lvl{position:absolute;right:-6px;bottom:-4px;min-width:24px;height:22px;padding:0 5px;border-radius:11px;background:#2a1a5a;border:2px solid var(--gold);font-size:12px;font-weight:700;display:grid;place-items:center}
.me .nm{display:flex;flex-direction:column;gap:2px;min-width:0}
.me .nm b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 #2a1a5a}
.xpbar{height:12px;width:84px;border-radius:7px;background:#2a1a5a;border:2px solid #1a0f40;overflow:hidden;position:relative}
.xpbar i{position:absolute;inset:0;width:0;background:linear-gradient(180deg,#7fe08f,#2f9f5f)}
.xpbar span{position:absolute;inset:0;font-size:8px;line-height:9px;text-align:center;font-weight:700}
.pill{display:flex;align-items:center;gap:3px;height:34px;padding:0 4px 0 2px;border-radius:17px;background:linear-gradient(180deg,#3a2a7a,#24175a);border:2px solid #1a0f40;box-shadow:inset 0 2px 0 rgba(255,255,255,.12);font-weight:700;font-size:14px;flex:0 0 auto}
.pill .ico{width:30px;height:30px;margin-left:-4px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.4))}
.pill .plus{width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,#7fe08f,#2f9f5f);display:grid;place-items:center;font-weight:900;font-size:16px;border:2px solid #14502a}
.pill .val{min-width:28px;text-align:center}
.pill.lives .sub{font-size:11px;opacity:.9;padding-right:4px}
.gear{width:40px;height:40px;border-radius:12px;background:var(--panel);border:2px solid var(--gold);display:grid;place-items:center;font-size:22px;box-shadow:var(--sh);position:relative;flex:0 0 auto}
.dot{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#ff3a4a;border:2px solid #fff;font-size:11px;font-weight:800;display:grid;place-items:center;color:#fff}

/* ---------- home ---------- */
#scr-home{background:#5f7fe0}
.scene{position:absolute;inset:0;width:100%;height:100%}
.anim .clouds{animation:drift calc(40s/var(--speed)) linear infinite alternate}
@keyframes drift{to{transform:translateX(40px)}}
.anim .falls rect{animation:fall 1.2s linear infinite;stroke-dasharray:6 10;stroke:#fff;stroke-opacity:.5}
@keyframes fall{to{stroke-dashoffset:-32}}
.anim .windows rect{animation:glowW 3s ease-in-out infinite alternate}
@keyframes glowW{to{fill:#fff6c8}}
.anim .isle{animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.anim .gatepulse{animation:gp 2.4s ease-in-out infinite}
@keyframes gp{50%{opacity:.5}}
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.particles i{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff6c8;box-shadow:0 0 8px 2px #ffe08a;opacity:0;animation:float 7s linear infinite}
@keyframes float{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(-240px) translateX(30px)}}
.home-wrap{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;padding-top:calc(env(safe-area-inset-top) + 64px);padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom))}
.logo{text-align:center;margin:2px auto 0;position:relative;filter:drop-shadow(0 4px 0 #3a1a6a) drop-shadow(0 8px 12px rgba(0,0,0,.4))}
.logo .crown{font-size:28px;display:block;margin-bottom:-12px}
.logo h1{margin:0;font-family:var(--title);font-weight:900;font-size:40px;line-height:.92;letter-spacing:.5px;background:linear-gradient(180deg,#fff8d0,#F4C75E 55%,#c8861f);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.6px #5a2a8a;paint-order:stroke fill}
.home-mid{position:relative;flex:1;display:flex;min-height:0}
.side{display:flex;flex-direction:column;gap:6px;padding:4px 6px;z-index:3;justify-content:flex-start}
.rbtn{position:relative;width:74px;display:flex;flex-direction:column;align-items:center;gap:0}
.rbtn .ic{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#6a4fb0,#2a1a5a);border:3px solid var(--gold);display:grid;place-items:center;font-size:32px;box-shadow:var(--sh);transition:transform .12s}
.rbtn:active .ic{transform:scale(.92)}
.rbtn .lb{margin-top:-10px;padding:2px 8px;border-radius:10px;background:#2a1a5a;border:2px solid #6a4fb0;font-size:12px;font-weight:700;white-space:nowrap;text-shadow:0 1px 0 #000}
.rbtn .dot{top:-2px;right:4px}
.stage{flex:1;position:relative;min-width:0}
.stage .prince{position:absolute;left:-10%;bottom:58px;width:78%;max-width:260px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.stage .cat{position:absolute;right:-6%;bottom:96px;width:44%;max-width:150px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.stage .pet{position:absolute;right:30%;bottom:72px;font-size:34px}
.anim .prince{animation:breathe 4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scaleY(1.015) translateY(-2px)}}
.anim .prince .wave{animation:wave 3s ease-in-out infinite;transform-origin:170px 176px}
@keyframes wave{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-10deg)}90%{transform:rotate(6deg)}}
.anim .blink{animation:blink 5s infinite;transform-origin:50% 40%}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.anim .cat .tail{animation:tail 2.4s ease-in-out infinite;transform-origin:112px 132px}
@keyframes tail{50%{transform:rotate(8deg)}}
.anim .cat .head{animation:tilt 6s ease-in-out infinite;transform-origin:80px 100px}
@keyframes tilt{40%,60%{transform:rotate(-5deg)}}
.playbig{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(92%,330px);z-index:4}
.playbtn{width:100%;padding:12px 14px 12px 64px;border-radius:40px;position:relative;background:linear-gradient(180deg,#7ff07f,#2fb43f 55%,#1f8a2f);border:4px solid #fff0b8;box-shadow:0 0 0 4px #c8861f,0 8px 0 #145a1f,0 14px 24px rgba(0,0,0,.4);text-align:center;transition:transform .1s}
.playbtn:active{transform:translateY(4px);box-shadow:0 0 0 4px #c8861f,0 4px 0 #145a1f}
.playbtn::before{content:"";position:absolute;left:18px;top:50%;transform:translateY(-50%);border-left:30px solid #ffe14a;border-top:20px solid transparent;border-bottom:20px solid transparent;filter:drop-shadow(0 2px 0 #8a5a10)}
.playbtn b{display:block;font-family:var(--title);font-size:34px;line-height:1;color:#fff8d8;text-shadow:0 3px 0 #145a1f}
.playbtn span{font-size:20px;font-weight:700;text-shadow:0 2px 0 #145a1f}
.anim .playbtn{animation:pglow 2s ease-in-out infinite}
@keyframes pglow{50%{box-shadow:0 0 0 4px #c8861f,0 8px 0 #145a1f,0 0 30px 6px rgba(255,240,140,.7)}}
.panel{margin:8px 10px 0;border-radius:var(--r);background:linear-gradient(180deg,rgba(110,70,180,.95),rgba(70,40,130,.95));border:3px solid #d9a13a;box-shadow:var(--sh);padding:8px;position:relative}
.panel h3{margin:0 0 6px;display:flex;align-items:center;gap:8px;font-family:var(--title);font-size:19px;color:#fff3c8;text-shadow:0 2px 0 #2a1a5a}
.panel h3 .tm{margin-left:auto;font-family:var(--font);font-size:13px;background:#fff3e0;color:#3a2a5a;border-radius:12px;padding:3px 10px}
.mcards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mcard{background:var(--panel2);color:#3a2a5a;border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px;border:2px solid #fff;min-height:74px}
.mcard .t{display:flex;gap:4px;align-items:center;font-size:12px;font-weight:700;line-height:1.1}
.mcard .t i{font-style:normal;font-size:22px}
.bar{height:16px;border-radius:9px;background:#c8b8a8;border:2px solid #8a7a6a;overflow:hidden;position:relative;margin-top:auto}
.bar i{position:absolute;inset:0;width:0;background:linear-gradient(180deg,#7ff07f,#2f9f3f);transition:width .6s}
.bar span{position:absolute;inset:0;font-size:11px;font-weight:800;text-align:center;line-height:13px;color:#fff;text-shadow:0 1px 1px #000}
.mcard.done{background:linear-gradient(180deg,#e8ffd8,#c8f0b8)}
.kprog{display:flex;align-items:center;gap:8px;cursor:pointer}
.kprog .ki{font-size:38px}
.kprog .kt{flex:1;min-width:0}
.kprog .kt b{font-family:var(--title);font-size:17px;color:#fff3c8}
.kprog .kt small{display:block;font-size:12px;opacity:.9}
.kprog .bar{margin-top:4px}
.circ{width:40px;height:40px;border-radius:50%;background:var(--goldline);display:grid;place-items:center;font-size:20px;font-weight:900;color:#3a2a5a;flex:0 0 auto}

/* ---------- tab bar ---------- */
#tabbar{position:absolute;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);background:linear-gradient(180deg,#4a2f8a,#2a1a5a);border-top:3px solid #d9a13a}
#tabbar.hide{display:none}
.tab{height:66px;border-radius:14px;background:linear-gradient(180deg,#5a3f9a,#3a2670);border:2px solid #6a4fb0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:4px;position:relative;transition:transform .15s}
.tab .ti{font-size:28px;line-height:1;transition:transform .2s}
.tab .tl{font-size:13px;font-weight:700;text-shadow:0 1px 0 #000}
.tab.on{background:linear-gradient(180deg,#d86ad8,#8a3aa8);border-color:var(--gold);transform:translateY(-6px);box-shadow:0 0 0 2px #fff3c8,0 6px 12px rgba(0,0,0,.4)}
.tab.on .ti{transform:scale(1.18) translateY(-4px)}
.tab.mid .ti{font-size:38px}

/* ---------- pages ---------- */
.page{padding:calc(env(safe-area-inset-top) + 66px) 12px calc(var(--tabh) + env(safe-area-inset-bottom) + 12px);overflow:auto;height:100%;-webkit-overflow-scrolling:touch;background:radial-gradient(circle at 50% 0,#5a3f9a,#24175a 60%)}
.page.nobar{padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ph h2{margin:0;font-family:var(--title);font-size:26px;color:#fff3c8;text-shadow:0 3px 0 #2a1a5a;flex:1}
.back{width:42px;height:42px;border-radius:50%;background:var(--goldline);color:#3a2a5a;font-weight:900;font-size:22px;box-shadow:var(--sh);flex:0 0 auto}
.card{background:var(--panel2);color:#3a2a5a;border-radius:16px;padding:12px;margin-bottom:10px;border:2px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.card h4{margin:0 0 6px;font-size:17px}
.card p{margin:4px 0;font-size:14px;line-height:1.35}
.card.dark{background:linear-gradient(180deg,#4a2f8a,#33206a);color:var(--white);border-color:#6a4fb0}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{opacity:.75;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;border-radius:14px;font-weight:700;font-size:15px;background:linear-gradient(180deg,#7ff07f,#2fa43f);color:#fff;text-shadow:0 1px 0 #145a1f;box-shadow:0 4px 0 #145a1f;border:2px solid #c8ffc8;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #145a1f}
.btn.blue{background:linear-gradient(180deg,#7fc0ff,#2859A8);box-shadow:0 4px 0 #14284D;border-color:#c8e4ff;text-shadow:0 1px 0 #14284D}
.btn.gold{background:var(--goldline);color:#4a2a0a;text-shadow:none;box-shadow:0 4px 0 #7a4a0a;border-color:#fff3c8}
.btn.red{background:linear-gradient(180deg,#ff9a8a,#d83a3a);box-shadow:0 4px 0 #7a1a1a;border-color:#ffd8d0}
.btn.ghost{background:rgba(255,255,255,.12);box-shadow:none;border-color:rgba(255,255,255,.3)}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13px;border-radius:11px}
.btn[disabled]{filter:grayscale(1);opacity:.55;pointer-events:none}
.btn.full{width:100%}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px;padding-bottom:2px}
.tabs button{padding:8px 14px;border-radius:12px;background:#3a2670;border:2px solid #6a4fb0;font-weight:700;white-space:nowrap}
.tabs button.on{background:var(--goldline);color:#3a2a5a;border-color:#fff3c8}
.grid{display:grid;gap:8px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.tile-card{background:var(--panel2);color:#3a2a5a;border-radius:14px;padding:8px;text-align:center;border:3px solid #fff;position:relative;cursor:pointer}
.tile-card .em{font-size:38px;line-height:1.2}
.tile-card .nm{font-size:12px;font-weight:700;line-height:1.15}
.tile-card.locked{filter:grayscale(1) brightness(.75)}
.tile-card.locked .em{opacity:.5}
.tile-card .q{position:absolute;right:6px;top:4px;font-weight:800;font-size:13px;background:#3a2a5a;color:#fff;border-radius:8px;padding:1px 6px}
.rar{height:5px;border-radius:3px;margin-top:4px}
.stat{background:#fff;border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:20px}
.stat small{font-size:11px;opacity:.75}
.badge{display:inline-block;padding:2px 8px;border-radius:9px;font-size:12px;font-weight:800;color:#fff}

/* settings */
.set h4{display:flex;gap:6px;align-items:center}
.set .it{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(58,42,90,.12);min-height:46px}
.set .it:first-of-type{border-top:0}
.set .it label{flex:1;font-size:15px}
.set .it small{display:block;font-size:12px;opacity:.7}
.sw{position:relative;width:52px;height:30px;flex:0 0 auto}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;z-index:1;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:15px;background:#b8aac8;transition:.2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.3);transition:.2s}
.sw input:checked+span{background:#2fa43f}
.sw input:checked+span::after{left:25px}
.sw input:focus-visible+span{outline:3px solid var(--royal)}
input[type=range]{width:46%;accent-color:#8866C8}
select,.inp{padding:8px 10px;border-radius:10px;border:2px solid #c8b8e8;background:#fff;color:#3a2a5a;max-width:60%}
.seg{display:flex;border-radius:10px;overflow:hidden;border:2px solid #c8b8e8}
.seg button{padding:6px 10px;font-size:13px;font-weight:700;color:#3a2a5a;background:#fff}
.seg button.on{background:#8866C8;color:#fff}

/* ---------- map ---------- */
#scr-map .page{padding-left:0;padding-right:0;background:#2a1a5a}
.mapzoom{transform-origin:50% 0;transition:transform .25s}
.region{position:relative;padding:14px 0 10px;overflow:hidden}
.region .rbg{position:absolute;inset:0;opacity:.95}
.region .rhead{position:relative;z-index:2;margin:0 12px 6px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;background:rgba(20,12,60,.55);border:2px solid var(--gold)}
.region .rhead b{font-family:var(--title);font-size:18px;color:#fff3c8;flex:1}
.region .rhead small{font-size:12px}
.path{position:relative;z-index:2;height:calc(20 * 78px + 20px)}
.path svg.trail{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:19px;background:radial-gradient(circle at 40% 30%,#ffe9a8,#d9a13a);color:#4a2a0a;border:3px solid #fff8d8;box-shadow:0 5px 0 #7a4a0a,0 8px 12px rgba(0,0,0,.35)}
.node.locked{background:radial-gradient(circle at 40% 30%,#9a96b8,#5a5680);color:#2a2a4a;border-color:#c8c4e0;box-shadow:0 5px 0 #3a3660}
.node.cur{background:radial-gradient(circle at 40% 30%,#a8ffa8,#2fb43f);color:#fff;text-shadow:0 2px 0 #145a1f;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 5px 0 #145a1f,0 0 0 10px rgba(255,255,200,.35)}}
.node.boss{width:74px;height:74px;margin:-37px 0 0 -37px;font-size:32px;background:radial-gradient(circle at 40% 30%,#ff9a8a,#8a1a3a);border-color:#ffd24a}
.node.boss.locked{background:radial-gradient(circle at 40% 30%,#9a96b8,#5a5680)}
.node .st{position:absolute;bottom:-14px;display:flex;gap:0}
.node .st .ico{width:16px;height:16px}
.node .tag{position:absolute;top:-12px;right:-10px;font-size:20px}
.node .me-pin{position:absolute;top:-40px;font-size:30px;animation:bob 1.4s ease-in-out infinite}
.mapctl{position:absolute;right:10px;bottom:calc(var(--tabh) + 14px);z-index:20;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:44px;height:44px;border-radius:50%;background:var(--goldline);color:#3a2a5a;font-weight:900;font-size:20px;box-shadow:var(--sh)}

/* ---------- game ---------- */
#scr-game{background:#2a1a5a}
#scr-game .gbg{position:absolute;inset:0;opacity:.9}
.gwrap{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 8px)}
.gtop{display:flex;gap:6px;align-items:stretch}
.gbox{border-radius:16px;background:linear-gradient(180deg,rgba(90,60,160,.96),rgba(50,30,110,.96));border:3px solid #d9a13a;box-shadow:var(--sh);padding:4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center}

<div id="app">

<noscript>Gembound Kingdom needs JavaScript to run.</noscript>
<script>
/* ===== Gembound Kingdom — match-3 engine (pure logic, no DOM) ===== */
(function (root) {
"use strict";

function mulberry32(a) {
  a = a >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const GEMS = ["Ruby", "Sapphire", "Emerald", "Citrine", "Amethyst", "Moonstone"];
const RELIC = -2, NOCOLOR = -1;
// obstacle definitions: where they live and how they break
const OBST = {
  stone:  { layer: "block", label: "Stone Barrier", adj: true,  power: true },
  vine:   { layer: "block", label: "Enchanted Vine", adj: true, power: true },
  chest:  { layer: "block", label: "Ancient Chest", adj: true,  power: true },
  shadow: { layer: "block", label: "Shadow Crystal", adj: false, power: true },
  cage:   { layer: "over",  label: "Crystal Cage",  adj: false, power: true },
  lock:   { layer: "over",  label: "Magical Lock",  adj: false, power: true },
  resin:  { layer: "over",  label: "Magic Resin",   adj: true,  power: true },
  ice:    { layer: "floor", label: "Frozen Floor",  adj: false, power: true },
  portal: { layer: "floor", label: "Sealed Portal", adj: false, power: true },
};

let NEXT_ID = 1;

class Game {
  /* level: {w,h,mask[],colors,moves,objectives[],obstacles[{t,r,c,hp}],preset[],seed,boss,relics,mode} */
  constructor(level, opts = {}) {
    this.level = level;
    this.w = level.w; this.h = level.h;
    this.rng = mulberry32(level.seed || 12345);
    this.ncolors = level.colors || 5;
    this.moves = level.moves == null ? 20 : level.moves;
    this.movesUsed = 0;
    this.score = 0;
    this.cascade = 0;
    this.fx = [];
    this.queue = [];      // pending special activations
    this.stats = { matched: 0, specialsMade: 0, specialsUsed: 0, combos: 0, maxCascade: 0, cores: 0, orbs: 0, beams: 0, sparks: 0, stars: 0, colorCleared: [0,0,0,0,0,0], relics: 0, blocksBroken: 0 };
    this.vineHit = false;
    this.relicsSpawned = 0;
    this.endless = !!level.endless;
    this.state = "play";
    this.objectives = (level.objectives || []).map(o => Object.assign({ got: 0 }, o));
    this.boss = level.boss ? Object.assign({ max: level.boss.hp, stage: 0 }, level.boss) : null;
    this.cells = [];
    for (let r = 0; r < this.h; r++) {
      const row = [];
      for (let c = 0; c < this.w; c++) {
        const hole = level.mask ? (level.mask[r] || "")[c] === " " : false;
        row.push({ hole, tile: null, block: null, over: null, floor: null });
      }
      this.cells.push(row);
    }
    for (const o of level.obstacles || []) {
      const cell = this.cell(o.r, o.c); if (!cell || cell.hole) continue;
      const def = OBST[o.t]; if (!def) continue;
      cell[def.layer] = { type: o.t, hp: o.hp || 1, max: o.hp || 1 };
    }
    if (level.preset) this.fillPreset(level.preset); else this.fillRandom();
    for (const s of level.startSpecials || []) this.placeRandomSpecial(s);
  }

  /* ---------- basic helpers ---------- */
  cell(r, c) { return r >= 0 && c >= 0 && r < this.h && c < this.w ? this.cells[r][c] : null; }
  tile(r, c) { const x = this.cell(r, c); return x ? x.tile : null; }
  rand(n) { return Math.floor(this.rng() * n); }
  newTile(color, sp) { return { id: NEXT_ID++, color, sp: sp || null }; }
  canHoldTile(r, c) { const x = this.cell(r, c); return !!x && !x.hole && !x.block; }
  movable(r, c) { const x = this.cell(r, c); return !!x && !x.hole && !x.block && !x.over && !!x.tile; }
  matchColor(r, c) { const t = this.tile(r, c); return t && t.color >= 0 ? t.color : null; }
  each(fn) { for (let r = 0; r < this.h; r++) for (let c = 0; c < this.w; c++) fn(this.cells[r][c], r, c); }
  randomColor() { return this.rand(this.ncolors); }

  fillPreset(preset) {
    // preset: rows of chars: 0-5 colors, R relic, '.' random, '#' none
    this.each((cell, r, c) => {
      if (cell.hole || cell.block) return;
      const ch = (preset[r] || "")[c];
      if (ch >= "0" && ch <= "5") cell.tile = this.newTile(+ch);
      else if (ch === "R") cell.tile = this.newTile(RELIC);
      else if ("hvkpo".includes(ch) && ch) cell.tile = this.newTile(ch === "o" ? NOCOLOR : 1 + "hvkp".indexOf(ch) % 3, { h: "bh", v: "bv", k: "core", p: "spark", o: "orb" }[ch]);
      else cell.tile = this.newTile(this.safeColor(r, c));
    });
    // re-roll random cells that accidentally form matches with preset gems
    for (let k = 0; k < 40; k++) {
      const m = this.findMatches(); if (!m.length) break;
      for (const g of m) for (const [r, c] of g.cells) if (((preset[r] || "")[c] || ".") === ".") this.cells[r][c].tile.color = this.randomColor();
    }
  }
  safeColor(r, c) {
    for (let tries = 0; tries < 20; tries++) {
      const col = this.randomColor();
      const l1 = this.matchColor(r, c - 1), l2 = this.matchColor(r, c - 2);
      const u1 = this.matchColor(r - 1, c), u2 = this.matchColor(r - 2, c);
      if (l1 === col && l2 === col) continue;
      if (u1 === col && u2 === col) continue;
      // avoid ready-made 2x2 squares
      if (l1 === col && u1 === col && this.matchColor(r - 1, c - 1) === col) continue;
      return col;
    }
    return this.randomColor();
  }
  fillRandom() {
    for (let attempt = 0; attempt < 50; attempt++) {
      this.each((cell, r, c) => { if (!cell.hole && !cell.block) cell.tile = null; });
      this.each((cell, r, c) => { if (!cell.hole && !cell.block) cell.tile = this.newTile(this.safeColor(r, c)); });
      const relicsStart = Math.min(this.level.relicsOnStart || 0, 3);
      for (let i = 0; i < relicsStart; i++) this.spawnRelicTop();
      if (this.findMatches().length === 0 && this.hasMoves()) return;
    }
  }
  spawnRelicTop() {
    const cand = [];
    for (let c = 0; c < this.w; c++) {
      for (let r = 0; r < Math.min(3, this.h); r++) {
        const x = this.cell(r, c);
        if (x && !x.hole && !x.block && !x.over && x.tile && x.tile.color >= 0 && !x.tile.sp) { cand.push([r, c]); break; }
      }
    }
    if (!cand.length) return;
    const [r, c] = cand[this.rand(cand.length)];
    this.cells[r][c].tile = this.newTile(RELIC); this.relicsSpawned++;
  }
  placeRandomSpecial(sp) {
    const cand = [];
    this.each((x, r, c) => { if (x.tile && !x.over && x.tile.color >= 0 && !x.tile.sp) cand.push([r, c]); });
    if (!cand.length) return null;
    const [r, c] = cand[this.rand(cand.length)];
    const t = this.cells[r][c].tile;
    if (sp === "beam") sp = this.rng() < 0.5 ? "bh" : "bv";
    t.sp = sp; if (sp === "orb" || sp === "star") t.color = NOCOLOR;
    return [r, c];
  }

  /* ---------- match detection ---------- */
  findMatches() {
    const H = this.h, W = this.w;
    const id = (r, c) => r * W + c;
    const parent = new Map();
    const find = a => { while (parent.get(a) !== a) { parent.set(a, parent.get(parent.get(a))); a = parent.get(a); } return a; };
    const add = a => { if (!parent.has(a)) parent.set(a, a); };
    const union = (a, b) => { add(a); add(b); const ra = find(a), rb = find(b); if (ra !== rb) parent.set(ra, rb); };
    const hRun = new Map(), vRun = new Map(), sq = new Set();
    // horizontal runs
    for (let r = 0; r < H; r++) {
      let c = 0;
      while (c < W) {
        const col = this.matchColor(r, c);
        if (col === null) { c++; continue; }
        let e = c; while (e + 1 < W && this.matchColor(r, e + 1) === col) e++;
        const len = e - c + 1;
        if (len >= 3) { for (let k = c; k <= e; k++) { union(id(r, c), id(r, k)); hRun.set(id(r, k), len); } }
        c = e + 1;
      }
    }
    for (let c = 0; c < W; c++) {
      let r = 0;
      while (r < H) {
        const col = this.matchColor(r, c);
        if (col === null) { r++; continue; }
        let e = r; while (e + 1 < H && this.matchColor(e + 1, c) === col) e++;
        const len = e - r + 1;
        if (len >= 3) { for (let k = r; k <= e; k++) { union(id(r, c), id(k, c)); vRun.set(id(k, c), len); } }
        r = e + 1;
      }
    }
    for (let r = 0; r + 1 < H; r++) for (let c = 0; c + 1 < W; c++) {
      const col = this.matchColor(r, c);
      if (col === null) continue;
      if (this.matchColor(r, c + 1) === col && this.matchColor(r + 1, c) === col && this.matchColor(r + 1, c + 1) === col) {
        const ids = [id(r, c), id(r, c + 1), id(r + 1, c), id(r + 1, c + 1)];
        ids.forEach(x => { union(ids[0], x); sq.add(x); });
      }
    }
    const groups = new Map();
    for (const k of parent.keys()) {
      const root = find(k);
      if (!groups.has(root)) groups.set(root, []);
      groups.get(root).push(k);
    }
    const out = [];
    for (const ids of groups.values()) {
      const cells = ids.map(k => [Math.floor(k / W), k % W]);
      let maxH = 0, maxV = 0, hasSq = false;
      ids.forEach(k => { maxH = Math.max(maxH, hRun.get(k) || 0); maxV = Math.max(maxV, vRun.get(k) || 0); if (sq.has(k)) hasSq = true; });
      const color = this.matchColor(cells[0][0], cells[0][1]);
      let make = null;
      if (Math.max(maxH, maxV) >= 6 || (maxH >= 3 && maxV >= 3 && cells.length >= 7)) make = "star";
      else if (Math.max(maxH, maxV) >= 5) make = "orb";
      else if (maxH >= 3 && maxV >= 3) make = "core";
      else if (maxH === 4 || maxV === 4) make = maxH >= maxV ? "bh" : "bv";
      else if (hasSq && maxH < 3 && maxV < 3) make = "spark";
      else if (hasSq) make = "spark";
      // intersection cell for L/T shapes
      let pivot = null;
      if (make === "core" || make === "star") pivot = ids.find(k => hRun.has(k) && vRun.has(k));
      out.push({ cells, color, make, pivot: pivot != null ? [Math.floor(pivot / W), pivot % W] : null, size: cells.length });
    }
    return out;
  }

  /* would swapping a and b create a match? */
  swapMakesMatch(a, b) {
    const ta = this.tile(a[0], a[1]), tb = this.tile(b[0], b[1]);
    this.cells[a[0]][a[1]].tile = tb; this.cells[b[0]][b[1]].tile = ta;
    const ok = this.matchAt(a[0], a[1]) || this.matchAt(b[0], b[1]);
    this.cells[a[0]][a[1]].tile = ta; this.cells[b[0]][b[1]].tile = tb;
    return ok;
  }
  matchAt(r, c) {
    const col = this.matchColor(r, c); if (col === null) return 0;
    let h = 1, v = 1;
    for (let k = c - 1; this.matchColor(r, k) === col; k--) h++;
    for (let k = c + 1; this.matchColor(r, k) === col; k++) h++;
    for (let k = r - 1; this.matchColor(k, c) === col; k--) v++;
    for (let k = r + 1; this.matchColor(k, c) === col; k++) v++;
    let s = 0;
    for (const [dr, dc] of [[-1, -1], [-1, 0], [0, -1], [0, 0]]) {
      const r0 = r + dr, c0 = c + dc;
      if ([[0, 0], [0, 1], [1, 0], [1, 1]].every(([a, b]) => this.matchColor(r0 + a, c0 + b) === col)) s = 4;
    }
    const best = Math.max(h >= 3 ? h : 0, v >= 3 ? v : 0, s);
    return best;
  }
  isSpecialTile(t) { return !!(t && t.sp); }
  listMoves() {
    const moves = [];
    for (let r = 0; r < this.h; r++) for (let c = 0; c < this.w; c++) {
      if (!this.movable(r, c)) continue;
      for (const [dr, dc] of [[0, 1], [1, 0]]) {
        const r2 = r + dr, c2 = c + dc;
        if (!this.movable(r2, c2)) continue;
        const a = this.tile(r, c), b = this.tile(r2, c2);
        if (a.color === RELIC && b.color === RELIC) continue;
        if (a.sp && b.sp) { moves.push({ a: [r, c], b: [r2, c2], score: 50 }); continue; }
        if ((a.sp === "orb" || a.sp === "star") || (b.sp === "orb" || b.sp === "star")) { moves.push({ a: [r, c], b: [r2, c2], score: 30 }); continue; }
        if (this.swapMakesMatch([r, c], [r2, c2])) {
          // score potential
          const ta = this.tile(r, c), tb = this.tile(r2, c2);
          this.cells[r][c].tile = tb; this.cells[r2][c2].tile = ta;
          const s = Math.max(this.matchAt(r, c), this.matchAt(r2, c2));
          this.cells[r][c].tile = ta; this.cells[r2][c2].tile = tb;
          moves.push({ a: [r, c], b: [r2, c2], score: s + (a.sp || b.sp ? 3 : 0) });
        }
      }
    }
    return moves;
  }
  hasMoves() {
    let special = false;
    this.each((x) => { if (x.tile && x.tile.sp && !x.over) special = true; });
    return special || this.listMoves().length > 0;
  }
  hint() {
    const m = this.listMoves();
    if (!m.length) return null;
    m.sort((x, y) => y.score - x.score);
    return m[0];
  }

  shuffle() {
    const spots = [], tiles = [];
    this.each((x, r, c) => { if (x.tile && !x.over && !x.block && x.tile.color >= 0 && !x.tile.sp) { spots.push([r, c]); tiles.push(x.tile); } });
    for (let attempt = 0; attempt < 100; attempt++) {
      for (let i = tiles.length - 1; i > 0; i--) { const j = this.rand(i + 1); [tiles[i], tiles[j]] = [tiles[j], tiles[i]]; }
      spots.forEach(([r, c], i) => { this.cells[r][c].tile = tiles[i]; });
      if (this.findMatches().length === 0 && this.hasMoves()) { this.fx.push({ type: "shuffle" }); return true; }
    }
    // fallback: recolor
    spots.forEach(([r, c]) => { this.cells[r][c].tile.color = this.safeColor(r, c); });
    this.fx.push({ type: "shuffle" });
    return this.hasMoves();
  }

  /* ---------- damage ---------- */
  addScore(n) { this.score += n; }
  hit(r, c, src, depth) {
    const x = this.cell(r, c); if (!x || x.hole) return false;
    if (x.block) {
      const def = OBST[x.block.type];
      if (src === "match" && !def.adj) return false;
      if (src === "adj" && !def.adj) return false;
      this.damageLayer(x, "block", r, c);
      return true;
    }
    if (src === "adj") {
      if (x.over && OBST[x.over.type].adj) { this.damageLayer(x, "over", r, c); return true; }
      return false;
    }
    if (x.over) { this.damageLayer(x, "over", r, c); return true; }
    const t = x.tile; if (!t) return false;
    if (t.color === RELIC) return false;
    if (t.sp) {
      this.queue.push({ sp: t.sp, color: t.color, r, c, depth: (depth || 0) + 1, id: t.id });
    }
    x.tile = null;
    this.fx.push({ type: "pop", r, c, id: t.id, color: t.color, sp: t.sp });
    if (t.color >= 0) {
      this.stats.colorCleared[t.color]++;
      for (const o of this.objectives) if (o.t === "color" && o.c === t.color) o.got++;
    }
    this.stats.matched++;
    this.addScore(60 * (1 + Math.min(this.cascade, 8) * 0.5));
    if (this.boss && this.boss.hp > 0) { this.boss.hp = Math.max(0, this.boss.hp - 1); }
    if (x.floor) this.damageLayer(x, "floor", r, c);
    return true;
  }
  damageLayer(x, layer, r, c) {
    const o = x[layer]; if (!o) return;
    o.hp--;
    this.fx.push({ type: "crack", r, c, ob: o.type, hp: o.hp });
    this.addScore(100);
    if (o.type === "vine") this.vineHit = true;
    if (o.hp <= 0) {
      x[layer] = null;
      this.stats.blocksBroken++;
      this.fx.push({ type: "break", r, c, ob: o.type });
      if (o.type === "chest") this.fx.push({ type: "coins", r, c, n: 5 });
      if (this.boss && this.boss.hp > 0) this.boss.hp = Math.max(0, this.boss.hp - 2);
    }
  }

  /* ---------- specials ---------- */
  mostCommonColor() {
    const cnt = new Array(this.ncolors).fill(0);
    this.each(x => { if (x.tile && x.tile.color >= 0) cnt[x.tile.color]++; });
    let best = 0; cnt.forEach((v, i) => { if (v > cnt[best]) best = i; });
    return best;
  }
  // choose a target for fairy spark: something that advances objectives
  sparkTarget(fromR, fromC) {
    const cand = [];
    const need = new Set(this.objectives.filter(o => !this.objDone(o)).map(o => o.t === "color" ? "c" + o.c : o.t));
    this.each((x, r, c) => {
      if (x.hole || (r === fromR && c === fromC)) return;
      let w = 0;
      if (x.block && need.has(x.block.type)) w = 5;
      else if (x.over && need.has(x.over.type)) w = 4;
      else if (x.floor && need.has(x.floor.type) && x.tile && x.tile.color >= 0) w = 4;
      else if (x.tile && x.tile.color >= 0 && need.has("c" + x.tile.color)) w = 2;
      else if (x.tile && x.tile.color >= 0) w = 1;
      if (this.boss && x.block && x.block.type === "shadow") w = Math.max(w, 5);
      if (w) cand.push({ r, c, w });
    });
    if (!cand.length) return null;
    const top = Math.max(...cand.map(o => o.w));
    const best = cand.filter(o => o.w === top);
    return best[this.rand(best.length)];
  }
  hitArea(cells, depth) { for (const [r, c] of cells) this.hit(r, c, "power", depth); }
  rowCells(r) { const a = []; for (let c = 0; c < this.w; c++) a.push([r, c]); return a; }
  colCells(c) { const a = []; for (let r = 0; r < this.h; r++) a.push([r, c]); return a; }
  blastCells(r, c, rad, roundCorners) {
    const a = [];
    for (let dr = -rad; dr <= rad; dr++) for (let dc = -rad; dc <= rad; dc++) {
      if (roundCorners && Math.abs(dr) === rad && Math.abs(dc) === rad) continue;
      a.push([r + dr, c + dc]);
    }
    return a;
  }
  activate(a) {
    const { sp, r, c, depth } = a;
    this.stats.specialsUsed++;
    this.addScore(200);
    switch (sp) {
      case "bh": this.stats.beams++; this.fx.push({ type: "beam", dir: "h", r, c }); this.hitArea(this.rowCells(r), depth); break;
      case "bv": this.stats.beams++; this.fx.push({ type: "beam", dir: "v", r, c }); this.hitArea(this.colCells(c), depth); break;
      case "core": this.stats.cores++; this.fx.push({ type: "boom", r, c, rad: 2 }); this.hitArea(this.blastCells(r, c, 2, true), depth); break;
      case "bigcore": this.fx.push({ type: "boom", r, c, rad: 3 }); this.hitArea(this.blastCells(r, c, 3, true), depth); break;
      case "cross3": {
        this.fx.push({ type: "beam", dir: "h", r, c, wide: 3 }); this.fx.push({ type: "beam", dir: "v", r, c, wide: 3 });
        const cells = []; for (let k = -1; k <= 1; k++) { cells.push(...this.rowCells(r + k)); cells.push(...this.colCells(c + k)); }
        this.hitArea(cells.filter(([x, y]) => x >= 0 && x < this.h && y >= 0 && y < this.w), depth); break;
      }
      case "cross": this.fx.push({ type: "beam", dir: "h", r, c }); this.fx.push({ type: "beam", dir: "v", r, c }); this.hitArea([...this.rowCells(r), ...this.colCells(c)], depth); break;
      case "orb": {
        this.stats.orbs++;
        const col = a.target != null ? a.target : this.mostCommonColor();
        const cells = [];
        this.each((x, rr, cc) => { if (x.tile && x.tile.color === col) cells.push([rr, cc]); });
        this.fx.push({ type: "orb", r, c, cells, color: col });
        this.hitArea(cells, depth); break;
      }
      case "spark": {
        this.stats.sparks++;
        this.hitArea([[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]], depth);
        const t = this.sparkTarget(r, c);
        if (t) {
          this.fx.push({ type: "spark", r, c, tr: t.r, tc: t.c });
          if (a.payload) this.queue.push({ sp: a.payload, r: t.r, c: t.c, depth: depth + 1 });
          else this.hit(t.r, t.c, "power", depth);
        }
        break;
      }
      case "star": {
        this.stats.stars++;
        this.fx.push({ type: "star", r, c });
        this.fx.push({ type: "beam", dir: "h", r, c }); this.fx.push({ type: "beam", dir: "v", r, c });
        const cells = [...this.rowCells(r), ...this.colCells(c)];
        for (let k = 1; k < Math.max(this.w, this.h); k++) cells.push([r + k, c + k], [r - k, c - k], [r + k, c - k], [r - k, c + k]);
        this.hitArea(cells, depth);
        // second stage: three bursts on objective targets
        for (let i = 0; i < 3; i++) { const t = this.sparkTarget(r, c); if (t) this.queue.push({ sp: "smallboom", r: t.r, c: t.c, depth: depth + 1 }); }
        break;
      }
      case "smallboom": this.fx.push({ type: "boom", r, c, rad: 1 }); this.hitArea(this.blastCells(r, c, 1, false), depth); break;
      case "nova": {
        this.fx.push({ type: "nova", r, c });
        const cells = []; this.each((x, rr, cc) => cells.push([rr, cc]));
        this.hitArea(cells, depth);
        this.each((x, rr, cc) => { if (x.block) this.hit(rr, cc, "power", depth); });
        break;
      }
      case "convert": {
        // orb + special: convert one color into specials then fire them
        const col = a.target != null ? a.target : this.mostCommonColor();
        const cells = [];
        this.each((x, rr, cc) => { if (x.tile && x.tile.color === col && !x.tile.sp && !x.over) cells.push([rr, cc]); });
        cells.forEach(([rr, cc]) => {
          let s = a.into; if (s === "beam") s = this.rng() < 0.5 ? "bh" : "bv";
          this.cells[rr][cc].tile.sp = s;
        });
        this.fx.push({ type: "orb", r, c, cells, color: col, convert: a.into });
        this.hitArea(cells, depth);
        break;
      }
    }
  }
  /* run one wave of queued activations; returns true if anything ran */
  runWave() {
    if (!this.queue.length) return false;
    const wave = this.queue; this.queue = [];
    for (const a of wave) this.activate(a);
    return true;
  }

  /* combination when two specials are swapped / or tap a single special */
  comboOf(a, b) {
    const kind = t => (t === "bh" || t === "bv") ? "beam" : t;
    const ka = kind(a.sp), kb = kind(b.sp);
    const has = k => ka === k || kb === k;
    const other = k => (ka === k ? b : a);
    if (has("star")) return { sp: "nova" };
    if (ka === "orb" && kb === "orb") return { sp: "nova" };
    if (has("orb")) { const o = other("orb"); const into = kind(o.sp); return { sp: "convert", into, target: o.color }; }
    if (ka === "core" && kb === "core") return { sp: "bigcore" };
    if (has("beam") && has("core")) return { sp: "cross3" };
    if (ka === "beam" && kb === "beam") return { sp: "cross" };
    if (ka === "spark" && kb === "spark") return { sp: "triplespark" };
    if (has("spark")) { const o = other("spark"); return { sp: "spark", payload: kind(o.sp) === "beam" ? (this.rng() < 0.5 ? "bh" : "bv") : o.sp }; }
    return { sp: "cross" };
  }

  /* ---------- player actions ---------- */
  // returns {ok:boolean, combo?:bool}
  trySwap(a, b) {
    if (this.state !== "play") return { ok: false };
    if (Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) !== 1) return { ok: false };
    if (!this.movable(a[0], a[1]) || !this.movable(b[0], b[1])) return { ok: false, blocked: true };
    const ta = this.tile(a[0], a[1]), tb = this.tile(b[0], b[1]);
    this.cascade = 0; this.vineHit = false; this.fx = [];
    // special + special => combo
    if (ta.sp && tb.sp) {
      this.cells[a[0]][a[1]].tile = null; this.cells[b[0]][b[1]].tile = null;
      this.fx.push({ type: "pop", r: a[0], c: a[1], id: ta.id, sp: ta.sp, color: ta.color });
      this.fx.push({ type: "pop", r: b[0], c: b[1], id: tb.id, sp: tb.sp, color: tb.color });
      const cb = this.comboOf(ta, tb);
      this.stats.combos++;
      this.spendMove();
      if (cb.sp === "triplespark") { for (let i = 0; i < 3; i++) this.queue.push({ sp: "spark", r: b[0], c: b[1], depth: 0 }); }
      else this.queue.push(Object.assign({ r: b[0], c: b[1], depth: 0 }, cb));
      this.fx.push({ type: "combo", r: b[0], c: b[1], name: cb.sp });
      return { ok: true, combo: true, swapBack: false };
    }
    // orb / star with normal tile
    if ((ta.sp === "orb" || tb.sp === "orb" || ta.sp === "star" || tb.sp === "star") && (ta.color !== RELIC && tb.color !== RELIC)) {
      const sp = (ta.sp === "orb" || ta.sp === "star") ? ta : tb;
      const other = sp === ta ? tb : ta;

      work += hp * (t === "shadow" ? 2.6 : t === "vine" ? 2.5 : L === "floor" ? 0.55 : 0.75);
    }
  }
  const objectives = [];
  const placedTypes = [...new Set(obstacles.map(o => o.t))];
  placedTypes.forEach(t => objectives.push({ t }));
  if (relicN) objectives.push({ t: "relic", n: relicN });
  if (objectives.length < 2 || rng() < 0.35) {
    const cn = Math.round((14 + region * 2 + d * 4) * (objectives.length ? 0.8 : 1.4));
    objectives.push({ t: "color", c: Math.floor(rng() * base.colors), n: cn });
    work += cn / 4;
  }
  let moves = Math.round((12 + work * 0.62) * DIFF[d].f);
  let boss = null;
  if (i === 20) {
    const B = BOSSES[region];
    const hp = 170 + region * 9;
    boss = { name: B.name, face: B.face, shield: B.shield, hp };
    objectives.length = 0;
    objectives.push({ t: "boss" });
    moves = Math.round(24 + region * 1.5);
  }
  moves = Math.max(14, Math.min(moves, 50));
  return Object.assign(base, { obstacles, objectives, moves, boss, relicsOnStart: relicN ? 1 : 0, treasure,
    coins: 30 + d * 15 + region * 5 + (treasure ? 60 : 0) });
}

/* ---------------- map ---------------- */
let mapZoom = 1;
function nodePos(i) { const xs = [50, 70, 80, 70, 50, 30, 20, 30]; return { x: xs[i % 8], y: (D.PER_REGION - 1 - i) * 78 + 50 }; }
function renderMap() {
  const el = $("#scr-map");
  const regions = D.REGIONS.map((R, ri) => {
    const nodes = [];
    let d = "";
    for (let i = 0; i < D.PER_REGION; i++) {
      const n = ri * D.PER_REGION + i + 1, p = nodePos(i);
      d += (i ? " L" : "M") + p.x + " " + p.y;
      const b = S.best[n], locked = n > S.level, cur = n === S.level, boss = i === D.PER_REGION - 1;
      const diff = D.difficultyOf(i + 1);
      const tag = boss ? "" : (i + 1) === 10 ? "🎁" : (i + 1) === 12 ? "🗝️" : diff >= 2 ? "💀" : "";
      nodes.push(`<button class="node ${locked ? "locked" : ""} ${cur ? "cur" : ""} ${boss ? "boss" : ""}" style="left:${p.x}%;top:${p.y}px;${!locked && !cur && !boss && diff ? `background:radial-gradient(circle at 40% 30%,#fff,${D.DIFF[diff].color})` : ""}" data-lvl="${n}" aria-label="Level ${n}${locked ? " locked" : ""}">
        ${boss ? (locked ? "🔒" : D.BOSSES[ri].face) : locked ? "🔒" : n}${tag ? `<span class="tag">${tag}</span>` : ""}
        ${b ? `<span class="st">${[1, 2, 3].map(k => A.starSvg(b.stars >= k)).join("")}</span>` : ""}${cur ? `<span class="me-pin">${S.avatar}</span>` : ""}</button>`);
    }
    const sk = R.sky; const got = Array.from({ length: D.PER_REGION }, (_, i) => (S.best[ri * D.PER_REGION + i + 1] || {}).stars || 0).reduce((a, b) => a + b, 0);
    return `<section class="region" id="reg${ri}"><div class="rbg" style="background:linear-gradient(180deg,${sk[2]},${sk[1]} 50%,${R.ground})"></div>
      <div class="rhead"><span style="font-size:26px">${R.icon}</span><b>${ri + 1}. ${R.name}</b><small>⭐ ${got}/${D.PER_REGION * 3}</small></div>
      <div class="path"><svg class="trail" viewBox="0 0 100 ${D.PER_REGION * 78 + 20}" preserveAspectRatio="none"><path d="${d}" stroke="#fff8d8" stroke-width="5" stroke-dasharray="2 7" stroke-linecap="round" fill="none" vector-effect="non-scaling-stroke" opacity=".85"/></svg>${nodes.join("")}</div></section>`;
  });
  el.innerHTML = `<div class="page" id="mapScroll"><div class="mapzoom" id="mapZ" style="transform:scale(${mapZoom})">
    <div class="row" style="padding:0 12px 8px"><button class="btn gold sm" data-nav="modes">⚔️ ${t("Challenge Modes")}</button><button class="btn blue sm" data-nav="kingdom">👑 Restore Kingdom</button><span class="grow"></span><span class="badge" style="background:#3a2670">⭐ ${totalStars()}</span></div>
    <div style="display:flex;flex-direction:column-reverse">${regions.join("")}</div></div></div>
    <div class="mapctl"><button id="zIn" aria-label="Zoom in">＋</button><button id="zOut" aria-label="Zoom out">－</button><button id="zCur" aria-label="Go to current level">📍</button></div>`;
  $$(".node", el).forEach(b => b.onclick = () => { SND.play("click"); const n = +b.dataset.lvl; if (n > S.level) { toast("🔒 Finish level " + (n - 1) + " first"); return; } levelStart(n); });
  const zoom = z => { mapZoom = Math.max(0.6, Math.min(1.4, z)); $("#mapZ").style.transform = `scale(${mapZoom})`; };
  $("#zIn").onclick = () => zoom(mapZoom + 0.15); $("#zOut").onclick = () => zoom(mapZoom - 0.15);
  const toCur = () => { const c = $(".node.cur", el) || $$(".node:not(.locked)", el).pop(); if (c) c.scrollIntoView({ block: "center" }); };
  $("#zCur").onclick = toCur; setTimeout(toCur, 30);
  // pinch zoom
  let pd = 0; const sc = $("#mapScroll");
  sc.addEventListener("touchmove", e => { if (e.touches.length === 2) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); if (pd) zoom(mapZoom * d / pd); pd = d; e.preventDefault(); } }, { passive: false });
  sc.addEventListener("touchend", () => (pd = 0));
}

/* ---------------- level start ---------------- */
function startNext() {
  if (CUR === "game") return;
  if (S.level > D.MAX_LEVEL) { toast("🎉 You finished the campaign! Try the Challenge Modes."); go("modes"); return; }
  levelStart(S.level);
}
async function levelStart(n) {
  lifeTick();
  const L = D.makeLevel(n);
  const R = D.REGIONS[L.region];
  if (S.lives <= 0 && !unlimited()) { showLives(); return; }
  if (L.index === 1 && !S.flags.story[L.region]) { await story(L.region); S.flags.story[L.region] = 1; save(); }
  const pre = {};
  const dc = D.DIFF[L.difficulty];
  const objHTML = L.objectives.map(o => objIcon(o, L)).join("");
  const preIds = ["pre_beam", "pre_core", "pre_orb"];
  const m = modal({ title: `${t("Level")} ${n}`, html: `<div style="text-align:center;margin:-6px 0 8px"><span class="badge" style="background:${dc.color}">${dc.name}</span> <span class="badge" style="background:#3a2670">${R.icon} ${R.name}</span>${L.treasure ? ' <span class="badge" style="background:#b8801f">🗝️ Treasure stage</span>' : ""}</div>
    <div class="inner"><b>${t("Objectives")}</b><div class="row wrap" style="justify-content:center;margin:6px 0">${objHTML}</div>
    <p class="muted" style="text-align:center">${L.boss ? `Defeat <b>${L.boss.name}</b> in ${L.moves} moves! Every gem you clear hurts it; breaking obstacles hurts more.` : `${L.moves} moves`}${S.best[n] ? ` · Best: ${"⭐".repeat(S.best[n].stars)} ${fmt(S.best[n].score)}` : ""}</p>
    ${n >= 4 ? `<b>Pre-level boosters</b><div class="row" style="justify-content:center;gap:8px;margin-top:6px">${preIds.map(id => `<button class="tile-card" data-pre="${id}" style="width:86px" aria-pressed="false"><div class="em">${D.BOOSTERS[id].icon}</div><div class="nm">${D.BOOSTERS[id].name}</div><span class="q">${S.boosters[id] || 0}</span></button>`).join("")}</div><p class="muted" style="text-align:center">Tap to add. Used only when you press Play.</p>` : ""}</div>`,
    buttons: [{ label: `▶ ${t("Play")}`, cls: "", onClick: api => { api.close(); beginLevel(L, Object.keys(pre).filter(k => pre[k])); } }] });
  $$("[data-pre]", m.el).forEach(b => b.onclick = async () => {
    const id = b.dataset.pre;
    if (!(S.boosters[id] > 0)) {
      if (await spend("coins", D.BOOSTERS[id].price, `Buy 1 ${D.BOOSTERS[id].name}`)) { S.boosters[id] = (S.boosters[id] || 0) + 1; logBooster(id, 1, "Bought"); save(); $(".q", b).textContent = S.boosters[id]; }
      return;
    }
    pre[id] = !pre[id]; b.style.borderColor = pre[id] ? "#2fb43f" : "#fff"; b.style.background = pre[id] ? "#d8ffd0" : ""; b.setAttribute("aria-pressed", pre[id]);
  });
}
function objIcon(o, L, rem) {
  let ic = "";
  if (o.t === "color") ic = A.gem(o.c);
  else if (o.t === "relic") ic = A.relic();
  else if (o.t === "score") ic = `<span class="em">⭐</span>`;
  else if (o.t === "boss") ic = `<span class="em">${L.boss ? L.boss.face : "👹"}</span>`;
  else if (o.t === "ice") ic = `<span class="em">🧊</span>`;
  else if (o.t === "portal") ic = `<span class="em">🌀</span>`;
  else ic = A.obstacle(o.t, o.t === "lock" ? 2 : 1, 1);
  let n = rem != null ? rem : o.n != null ? o.n : (L.obstacles || []).filter(x => x.t === o.t).length;
  if (o.t === "boss" && rem == null) n = L.boss.hp;
  const label = o.t === "color" ? E.GEMS[o.c] : o.t === "relic" ? "Relics" : o.t === "boss" ? "Boss HP" : (E.OBST[o.t] || { label: o.t }).label;
  return `<div class="obj ${rem === 0 ? "done" : ""}" data-obj="${o.t}${o.c != null ? o.c : ""}" title="${label}" aria-label="${label}: ${n} left">${ic}<span class="n">${rem === 0 ? "✔" : fmt(n)}</span></div>`;
}

/* ---------------- story ---------------- */
function story(ri, lines) {
  lines = lines || D.REGIONS[ri].story;
  return new Promise(res => {
    let i = 0;
    const m = modal({ title: `${D.REGIONS[ri].icon} ${D.REGIONS[ri].name}`, html: "", buttons: [], onClose: () => res() });
    const step = () => {
      if (i >= lines.length) { m.close(); return; }
      const [who, txt] = lines[i];
      SND.play("voice", who === "lumi" ? 1 : 0);
      m.set(`<div class="dlg"><div class="who">${who === "lumi" ? A.CAT : A.PRINCE}</div><div class="say"><b>${who === "lumi" ? "Lumi" : "Prince Aurelio"}</b>${esc(txt)}</div></div><p class="muted" style="text-align:center">Chapter ${ri + 1} · ${i + 1}/${lines.length}</p>`,
        [{ label: "Skip story", cls: "ghost", onClick: () => m.close() }, { label: i === lines.length - 1 ? "Let's go!" : "Next ›", cls: "gold", onClick: () => { i++; step(); } }]);
    };
    step();
  });
}

  if (GL.mode === "daily" && S.modes.daily !== todayKey()) { S.modes.daily = todayKey(); r = { coins: 150, crystals: 5 }; }
  if (GL.mode === "treasure") r = { coins: 120, chest: "silver" };
  if (GL.mode === "master" && S.modes.master !== weekKey()) { S.modes.master = weekKey(); r = { coins: 200, crystals: 10 }; }
  const shown = grant(r, D.MODES.find(m => m.id === GL.mode).name);
  try { localStorage.removeItem("gk_inlevel"); } catch (e) {}
  checkUnlocks(); save(true);
  await sleep(animMs(900));
  modal({ title: "🎉 Challenge cleared!", noClose: true, html: `<div class="inner" style="text-align:center"><div style="font-size:30px;font-weight:800">${fmt(G.score)}</div>${rewardHTML(shown)}</div>`, buttons: [{ label: "Done", cls: "", onClick: api => { api.close(); leaveGame(); go("modes"); openChests(); } }] });
};

/* ---------------- boot ---------------- */
async function boot() {
  document.body.insertAdjacentHTML("afterbegin", A.defs());
  const st = await load();
  buildChrome();
  ensureMissions();
  checkUnlocks();
  applySettings();
  refreshTop();
  show("home");
  // recover an interrupted level
  try {
    const il = JSON.parse(localStorage.getItem("gk_inlevel") || "null");
    if (il) { localStorage.removeItem("gk_inlevel"); toast("Your last level was interrupted — no life was lost."); }
  } catch (e) {}
  if (st.recovered) toast("⚠️ Your save was damaged — restored from the backup copy.");
  if (st.fresh) {
    S.created = Date.now(); checkUnlocks();
    inbox({ t: "system", title: "Welcome to Gembound Kingdom!", body: "Here's a welcome gift to start your adventure.", reward: { coins: 200, booster: "hammer" } });
    inbox({ t: "event", title: "Events are live", body: "Check the Events screen for this week's challenges and festival." });
  }
  // event announcement once per event key
  for (const ev of D.activeEvents()) { if (!S.events[ev.key] && S.settings.notif.events && !ev.tournament) { eventState(ev); if (!st.fresh) inbox({ t: "event", title: ev.icon + " " + ev.name + " has started", body: ev.desc }); } }
  if (dailyStatus().can && S.settings.notif.daily && !st.fresh) setTimeout(() => { if (CUR === "home" && !modalStack.length) showDaily(); }, 900);
  save();
  setInterval(() => { lifeTick(); if (CUR !== "game") { const lp = $("#livesPill .sub"); if (lp) lp.textContent = unlimited() ? dur(S.unlimitedUntil - Date.now()) : S.lives >= MAX_LIVES ? t("Full") : dur(nextLifeIn()); const lv = $("#livesPill .val"); if (lv) lv.textContent = unlimited() ? "∞" : S.lives; const mt = $("#mTimer"); if (mt) mt.textContent = "⏱ " + dur(nextMidnight() - Date.now()); if (S.missions.day !== todayKey()) { ensureMissions(); if (CUR === "home") renderHome(); } } }, 1000);
  document.addEventListener("pointerdown", () => SND.unlock(), { once: false, passive: true });
  document.addEventListener("visibilitychange", () => { if (document.hidden) { save(true); SND.setMusic(null); } else { lifeTick(); refreshTop(); SND.setMusic(CUR === "game" ? "puzzle" : "menu"); } });
  window.addEventListener("pagehide", () => save(true));
  document.addEventListener("keydown", e => { if (e.key === "Escape") { if (modalStack.length) { const m = modalStack[modalStack.length - 1]; if (!m.noClose) m.close(); } else if (CUR === "game") pauseMenu(); else if (PAGE) back(); } });
  if (NATIVE && PLUG.App) PLUG.App.addListener("backButton", () => {
    if (modalStack.length) { const m = modalStack[modalStack.length - 1]; if (!m.noClose) m.close(); return; }
    if (CUR === "game") { pauseMenu(); return; }
    if (PAGE) { back(); return; }
    if (CUR !== "home") { go("home"); return; }
    PLUG.App.exitApp();
  });
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !NATIVE && !/claude|anthropic/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
  window.__gk = { get S() { return S; }, get G() { return G; }, go, levelStart, beginLevel, D };
}
boot();

})();
</script>
